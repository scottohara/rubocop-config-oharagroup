---
plugins:
  - rubocop-rails

AllCops:
  Exclude:
    - "bin/*"
    - "config/**/*"
    - "db/migrate/*"
    - "db/schema.rb"
    - "spec/*_helper.rb"

# Allow Rails.env.production? and similar usage
Rails/Env:
  Enabled: false

# Allow reading of ENV vars for authentication
Rails/EnvironmentVariableAccess:
  AllowReads: true
